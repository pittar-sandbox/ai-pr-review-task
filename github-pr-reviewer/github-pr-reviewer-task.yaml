apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: github-pr-reviewer
  namespace: openshift-pipelines
  labels:
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: pr-reviewer
    app.kubernetes.io/part-of: github-integration
    tekton.dev/version: "v1beta1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.47.0"
    tekton.dev/categories: GitHub
    tekton.dev/tags: github, pr, review, automation
    tekton.dev/displayName: "GitHub PR Reviewer"
    description: "Automatically reviews GitHub pull requests using AI analysis"
spec:
  description: |
    This task automatically reviews GitHub pull requests by analyzing code changes,
    identifying potential issues, security concerns, and providing structured feedback.
    It runs as part of an OpenShift Pipelines workflow triggered by GitHub webhooks.

  params:
    - name: github-token-secret
      type: string
      description: "Name of the secret containing the GitHub token"
      default: "github-token"

    - name: github-token-key
      type: string
      description: "Key in the secret that contains the GitHub token"
      default: "token"

    - name: owner
      type: string
      description: "GitHub repository owner"
      
    - name: repo
      type: string
      description: "GitHub repository name"
      
    - name: pr-number
      type: string
      description: "Pull request number"
      
    - name: api-url
      type: string
      description: "GitHub API URL"
      default: "https://api.github.com"
      
    - name: review-type
      type: string
      description: "Type of review to submit"
      default: "COMMENT"
      enum: ["COMMENT", "APPROVE", "REQUEST_CHANGES"]

    - name: image
      type: string
      description: "Container image to use for the task"
      default: "image-registry.openshift-image-registry.svc:5000/openshift-pipelines/github-pr-reviewer:latest"

    - name: verbosity
      type: string
      description: "Log verbosity level"
      default: "INFO"

    # AI Analysis Parameters
    - name: ai-endpoint
      type: string
      description: "OpenAI-compatible AI endpoint URL"
      default: ""

    - name: ai-token-secret
      type: string
      description: "Name of the secret containing the AI token"
      default: "ai-token"

    - name: ai-token-key
      type: string
      description: "Key in the secret that contains the AI token"
      default: "token"

    - name: ai-model
      type: string
      description: "AI model name to use"
      default: "gpt-3.5-turbo"

    - name: ai-temperature
      type: string
      description: "AI temperature for responses"
      default: "0.1"

  workspaces:
    - name: output
      description: "Workspace for output artifacts and analysis results"
      optional: true
      mountPath: /workspace/output

    - name: github-token
      description: "Workspace containing the GitHub token secret"
      optional: true
      mountPath: /workspace/github-token

    - name: ai-token
      description: "Workspace containing the AI token secret"
      optional: true
      mountPath: /workspace/ai-token

  stepTemplate:
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsUser: 1001
      capabilities:
        drop: ["ALL"]
    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: PYTHONIOENCODING
        value: "UTF-8"

  steps:
    - name: validate-parameters
      image: $(params.image)
      script: |
        #!/usr/bin/env python3
        import sys
        import os
        import logging
        
        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)
        
        # Validate required parameters
        required_params = ["owner", "repo", "pr-number"]
        missing_params = []
        
        for param in required_params:
            value = os.environ.get(f"PARAM_{param.upper()}")
            if not value:
                missing_params.append(param)
        
        if missing_params:
            logger.error(f"Missing required parameters: {', '.join(missing_params)}")
            sys.exit(1)
        
        # Validate PR number is numeric
        try:
            pr_num = int(os.environ.get("PARAM_PR-NUMBER"))
            if pr_num <= 0:
                raise ValueError("PR number must be positive")
        except ValueError as e:
            logger.error(f"Invalid PR number: {e}")
            sys.exit(1)
        
        logger.info("Parameter validation successful")
        echo "Parameters validated successfully"
      timeout: 300s

    - name: extract-tokens
      image: $(params.image)
      script: |
        #!/usr/bin/env bash
        set -e
        
        echo "Extracting GitHub and AI tokens..."
        
        # Extract GitHub token
        GITHUB_TOKEN=""
        if [ -f "/workspace/github-token/token" ]; then
          GITHUB_TOKEN=$(cat /workspace/github-token/token | tr -d '\n')
        elif [ -n "$GITHUB_TOKEN" ]; then
          GITHUB_TOKEN="$GITHUB_TOKEN"
        elif [ -n "$(params.github-token-secret)" ]; then
          GITHUB_TOKEN=$(cat /var/secrets/$(params.github-token-secret)/$(params.github-token-key) 2>/dev/null || echo "")
        fi
        
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "Error: GitHub token not found in any expected location"
          exit 1
        fi
        
        echo "GitHub token found"
        
        # Extract AI token if endpoint is provided
        AI_TOKEN=""
        if [ -n "$(params.ai-endpoint)" ]; then
          if [ -f "/workspace/ai-token/token" ]; then
            AI_TOKEN=$(cat /workspace/ai-token/token | tr -d '\n')
          elif [ -n "$AI_TOKEN" ]; then
            AI_TOKEN="$AI_TOKEN"
          elif [ -n "$(params.ai-token-secret)" ]; then
            AI_TOKEN=$(cat /var/secrets/$(params.ai-token-secret)/$(params.ai-token-key) 2>/dev/null || echo "")
          fi
          
          if [ -z "$AI_TOKEN" ]; then
            echo "Warning: AI endpoint provided but AI token not found"
            echo "AI analysis will be disabled"
          else
            echo "AI token found"
          fi
        fi
        
        # Export tokens for next steps
        export GITHUB_TOKEN="$GITHUB_TOKEN"
        export AI_TOKEN="$AI_TOKEN"
        echo "Tokens extracted successfully"
      timeout: 60s

    - name: run-pr-review
      image: $(params.image)
      script: |
        #!/usr/bin/env python3
        import sys
        import os
        import json
        import logging
        import subprocess
        from pathlib import Path
        
        # Setup logging
        log_level = os.environ.get("PARAM_VERBOSITY", "INFO").upper()
        logging.basicConfig(level=getattr(logging, log_level, logging.INFO))
        logger = logging.getLogger(__name__)
        
        # Get parameters
        owner = os.environ["PARAM_OWNER"]
        repo = os.environ["PARAM_REPO"]
        pr_number = os.environ["PARAM_PR-NUMBER"]
        api_url = os.environ.get("PARAM_API-URL", "https://api.github.com")
        ai_endpoint = os.environ.get("PARAM_AI-ENDPOINT", "")
        ai_model = os.environ.get("PARAM_AI-MODEL", "gpt-3.5-turbo")
        ai_temperature = os.environ.get("PARAM_AI-TEMPERATURE", "0.1")
        
        logger.info(f"Starting PR review for {owner}/{repo} PR #{pr_number}")
        
        # Construct command
        cmd = [
            "/usr/local/bin/github_pr_reviewer.py",
            "--owner", owner,
            "--repo", repo,
            "--pr-number", pr_number,
            "--github-token", os.environ["GITHUB_TOKEN"],
            "--api-url", api_url
        ]
        
        # Add AI parameters if available
        if ai_endpoint:
            cmd.extend([
                "--ai-endpoint", ai_endpoint,
                "--ai-token", os.environ["AI_TOKEN"],
                "--ai-model", ai_model,
                "--ai-temperature", ai_temperature
            ])
            logger.info("AI analysis enabled")
        else:
            logger.info("AI analysis disabled")
        
        try:
            # Run the reviewer
            result = subprocess.run(cmd, capture_output=True, text=True, timeout=1800)
            
            # Print output for debugging
            if result.stdout:
                print("STDOUT:")
                print(result.stdout)
            if result.stderr:
                print("STDERR:")
                print(result.stderr, file=sys.stderr)
            
            # Save analysis output to workspace if available
            workspace_output = Path("/workspace/output")
            if workspace_output.exists():
                output_file = workspace_output / f"pr-{pr_number}-analysis.json"
                
                # Extract JSON output from stdout
                for line in result.stdout.split('\n'):
                    if line.startswith("GITHUB_PR_ANALYSIS_OUTPUT:"):
                        json_output = line.replace("GITHUB_PR_ANALYSIS_OUTPUT:", "").strip()
                        if json_output:
                            with open(output_file, 'w') as f:
                                f.write(json_output)
                            logger.info(f"Analysis saved to {output_file}")
                        break
            
            if result.returncode == 0:
                logger.info("PR review completed successfully")
                sys.exit(0)
            else:
                logger.error(f"PR review failed with return code {result.returncode}")
                sys.exit(result.returncode)
                
        except subprocess.TimeoutExpired:
            logger.error("PR review timed out after 30 minutes")
            sys.exit(124)
        except Exception as e:
            logger.error(f"Unexpected error during PR review: {e}")
            sys.exit(1)
      timeout: 2000s
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.github-token-secret)
              key: $(params.github-token-key)
              optional: true
        - name: AI_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.ai-token-secret)
              key: $(params.ai-token-key)
              optional: true

    - name: publish-results
      image: $(params.image)
      script: |
        #!/usr/bin/env bash
        set -e
        
        echo "Publishing review results..."
        
        # Create summary
        cat <<EOF > /workspace/output/pr-review-summary.txt
        GitHub PR Review Summary
        ========================
        
        Repository: $(echo $PARAM_OWNER)/$(echo $PARAM_REPO)
        PR Number: $(echo $PARAM_PR-NUMBER)
        Review Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Review Type: $(echo $PARAM_REVIEW-TYPE)
        
        Results: Check the GitHub PR for automated review comments.
        
        EOF
        
        echo "Results published to workspace"
      timeout: 60s

  results:
    - name: pr-number
      description: "The pull request number that was reviewed"
      type: string

    - name: owner
      description: "The repository owner"
      type: string

    - name: repo
      description: "The repository name"
      type: string

    - name: review-status
      description: "Status of the review (success/failure)"
      type: string

  finally:
    - name: cleanup
      image: $(params.image)
      script: |
        #!/usr/bin/env bash
        echo "Cleaning up workspace..."
        # Add any cleanup logic here
        echo "Cleanup completed"
      timeout: 60s